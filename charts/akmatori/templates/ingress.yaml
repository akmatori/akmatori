{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "akmatori.fullname" . }}
  labels:
    {{- include "akmatori.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Everything goes to the Akmatori proxy; it keeps /mcp and /ws
          # internal, so do not route paths to other services here.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "akmatori.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
