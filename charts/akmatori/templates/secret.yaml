{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.url) (not .Values.externalDatabase.existingSecret) -}}
{{- fail "postgresql.enabled=false needs externalDatabase.url or externalDatabase.existingSecret" -}}
{{- end -}}
{{- $name := include "akmatori.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $existingData := dict -}}
{{- if $existing }}{{- $existingData = $existing.data -}}{{- end -}}
{{- $pgPass := "" -}}
{{- if .Values.postgresql.password -}}
{{- $pgPass = .Values.postgresql.password -}}
{{- else if hasKey $existingData "postgres-password" -}}
{{- $pgPass = index $existingData "postgres-password" | b64dec -}}
{{- else -}}
{{- $pgPass = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "akmatori.labels" . | nindent 4 }}
  annotations:
    # Keep the generated database password if the release is deleted.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- if .Values.postgresql.enabled }}
  postgres-password: {{ $pgPass | quote }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.username $pgPass (include "akmatori.postgresHost" .) .Values.postgresql.database | quote }}
{{- else if .Values.externalDatabase.url }}
  database-url: {{ .Values.externalDatabase.url | quote }}
{{- end }}
{{- if and (not .Values.existingAuthSecret) .Values.adminPassword }}
  admin-password: {{ .Values.adminPassword | quote }}
{{- end }}
{{- if and (not .Values.existingAuthSecret) .Values.jwtSecret }}
  jwt-secret: {{ .Values.jwtSecret | quote }}
{{- end }}
