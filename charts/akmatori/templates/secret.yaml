{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.url) (not .Values.externalDatabase.existingSecret) -}}
{{- fail "postgresql.enabled=false needs externalDatabase.url or externalDatabase.existingSecret" -}}
{{- end -}}
{{- $name := include "akmatori.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $old := dict -}}
{{- if $existing }}{{- $old = default (dict) $existing.data -}}{{- end -}}
{{- /* PostgreSQL password: values > existing Secret > generated once. */ -}}
{{- $pgPass := "" -}}
{{- if hasKey $old "postgres-password" -}}
{{- $pgPass = index $old "postgres-password" | b64dec -}}
{{- if and .Values.postgresql.password (ne .Values.postgresql.password $pgPass) -}}
{{- fail "postgresql.password differs from the password in the existing Secret. The PostgreSQL data directory keeps the old password, so the API would fail to log in. Change the role password in PostgreSQL first (ALTER ROLE), then update the Secret, or unset postgresql.password." -}}
{{- end -}}
{{- else if .Values.postgresql.password -}}
{{- $pgPass = .Values.postgresql.password -}}
{{- else -}}
{{- $pgPass = randAlphaNum 32 -}}
{{- end -}}
{{- /*
Admin password and JWT secret: values > existing Secret. The API does not
store an ADMIN_PASSWORD from the environment in the database, so dropping it
on an upgrade would put the install back into setup mode. Keep the old value;
to remove it, delete the key from the Secret by hand.
*/ -}}
{{- $admin := .Values.adminPassword -}}
{{- if and (not $admin) (hasKey $old "admin-password") -}}{{- $admin = index $old "admin-password" | b64dec -}}{{- end -}}
{{- $jwt := .Values.jwtSecret -}}
{{- if and (not $jwt) (hasKey $old "jwt-secret") -}}{{- $jwt = index $old "jwt-secret" | b64dec -}}{{- end -}}
{{- $encUser := .Values.postgresql.username | urlquery | replace "+" "%20" -}}
{{- $encPass := $pgPass | urlquery | replace "+" "%20" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "akmatori.labels" . | nindent 4 }}
  annotations:
    # Keep the generated database password if the release is deleted.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- if .Values.postgresql.enabled }}
  postgres-password: {{ $pgPass | quote }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" $encUser $encPass (include "akmatori.postgresHost" .) .Values.postgresql.database | quote }}
{{- else if .Values.externalDatabase.url }}
  database-url: {{ .Values.externalDatabase.url | quote }}
{{- end }}
{{- if $admin }}
  admin-password: {{ $admin | quote }}
{{- end }}
{{- if $jwt }}
  jwt-secret: {{ $jwt | quote }}
{{- end }}
