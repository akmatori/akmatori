apiVersion: v1
kind: Service
metadata:
  name: {{ include "akmatori.frontendHost" . }}
  labels:
    {{- include "akmatori.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "akmatori.selector" (list . "frontend") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akmatori.frontendHost" . }}
  labels:
    {{- include "akmatori.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "akmatori.selector" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akmatori.selector" (list . "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "akmatori.image" (list . "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
