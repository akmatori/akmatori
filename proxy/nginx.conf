# Rendered by the nginx image's entrypoint (mounted as
# /etc/nginx/templates/default.conf.template, see docker-compose.yml).
# NGINX_LOCAL_RESOLVERS is filled in from the container's /etc/resolv.conf
# (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1): Docker's embedded DNS on Docker,
# aardvark-dns on Podman. Only variables set in the environment are
# substituted, so nginx's own $host etc. are left alone.
#
# Static upstreams resolve once at startup, so a deploy that recreates the
# app containers but not this proxy leaves it pointing at stale IPs (UI 502
# while /api keeps working). `server ... resolve` re-resolves every 10s and
# needs nginx >= 1.27.3.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

upstream frontend {
    zone frontend 64k;
    server frontend:80 resolve;
}

upstream backend {
    zone backend 64k;
    server akmatori-api:3000 resolve;
}

upstream mcp_gateway {
    zone mcp_gateway 64k;
    server mcp-gateway:8080 resolve;
}

server {
    listen 80;
    server_name localhost;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy auth requests to backend
    location /auth/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy webhook requests to backend
    location /webhook/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP gateway: only the tool schema list is public (the web UI renders
    # tool settings forms from it). Tool calls (/mcp/mcp, /mcp/sse) and the
    # gateway admin endpoints (/reload/*, /mcp-servers/*) are internal: the
    # agent worker and the API reach the gateway directly on the Docker
    # network. Exposing /mcp/mcp let anyone call tools without a run
    # allowlist; exposing /mcp-servers/test let anyone make the gateway
    # connect to any URL.
    location ~ ^/mcp/tools(/.*)?$ {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://mcp_gateway/tools$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        return 404;
    }

    # All other requests go to frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
